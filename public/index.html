<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SMTP Test Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #f5f5f5;
      }
      body {
        margin: 0;
        padding: 2rem;
      }
      main {
        max-width: 540px;
        margin: 0 auto;
        background: #fff;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.6rem;
        text-align: center;
      }
      form {
        display: grid;
        gap: 1rem;
      }
      label {
        font-weight: 600;
        display: block;
        margin-bottom: 0.35rem;
      }
      input,
      textarea,
      button {
        width: 100%;
        font-size: 1rem;
        padding: 0.6rem;
        border-radius: 4px;
        border: 1px solid #cfcfcf;
        box-sizing: border-box;
      }
      input[type='checkbox'] {
        width: auto;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-weight: 600;
      }
      button {
        cursor: pointer;
        background-color: #2563eb;
        color: #fff;
        border: none;
        transition: opacity 0.2s ease-in-out;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      .status {
        min-height: 1.5rem;
        font-weight: 600;
      }
      .status.error {
        color: #b91c1c;
      }
      .status.success {
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Send SMTP Test Email</h1>
      <form id="smtp-form">
        <div>
          <label for="host">SMTP Host *</label>
          <input id="host" name="host" type="text" required placeholder="smtp.example.com" />
        </div>
        <div>
          <label for="port">Port *</label>
          <input id="port" name="port" type="number" required min="1" max="65535" placeholder="587" />
        </div>
        <div class="inline">
          <input id="secure" name="secure" type="checkbox" />
          <label for="secure">Use SSL (secure)</label>
        </div>
        <div>
          <label for="user">SMTP Username</label>
          <input id="user" name="user" type="text" placeholder="user@example.com" />
        </div>
        <div>
          <label for="pass">SMTP Password</label>
          <input id="pass" name="pass" type="password" autocomplete="off" />
        </div>
        <div>
          <label for="from">From Email</label>
          <input id="from" name="from" type="email" placeholder="sender@example.com" />
        </div>
        <div>
          <label for="to">Recipient Email *</label>
          <input id="to" name="to" type="email" required placeholder="recipient@example.com" />
        </div>
        <div>
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="SMTP Test" />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Hello from the SMTP tester!"></textarea>
        </div>
        <button id="submit-btn" type="submit">Send Test Email</button>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </main>
    <script>
      const form = document.getElementById('smtp-form');
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusEl.textContent = 'Sending test email...';
        statusEl.className = 'status';
        submitBtn.disabled = true;

        const formData = new FormData(form);
        const payload = {
          host: formData.get('host')?.trim(),
          port: Number(formData.get('port')),
          secure: formData.get('secure') === 'on',
          user: formData.get('user')?.trim(),
          pass: formData.get('pass'),
          from: formData.get('from')?.trim(),
          to: formData.get('to')?.trim(),
          subject: formData.get('subject')?.trim(),
          message: formData.get('message')
        };

        try {
          const response = await fetch('/api/send-test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error || 'Unknown error');
          }

          statusEl.textContent = `Success! Message ID: ${body.messageId || 'N/A'}`;
          statusEl.classList.add('success');
          form.reset();
        } catch (err) {
          statusEl.textContent = `Error: ${err.message}`;
          statusEl.classList.add('error');
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
